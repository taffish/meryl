[package]
name = "meryl"
kind = "tool"
version = "1.4.2"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/meryl"

[command]
name = "taf-meryl"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/meryl:1.4.2-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["kmer", "genome-assembly", "quality-control", "sequence-analysis"]
keywords = ["meryl", "k-mer", "kmer", "histogram", "counting", "meryl-lookup", "Merqury", "assembly-evaluation", "SAM", "BAM", "CRAM", "ploidy"]
description = "Meryl is a genomic k-mer counter and sequence utility used by Merqury and related assembly-evaluation workflows."

[upstream]
name = "Meryl"
type = "github"
repo = "marbl/meryl"
homepage = "https://github.com/marbl/meryl"
release_url = "https://github.com/marbl/meryl/tree/v1.4.2"
downloads = "https://codeload.github.com/marbl/meryl/tar.gz/dbacc3d0fd26bcd4247dcaf5b7e70ffdf5f69831; https://codeload.github.com/marbl/meryl-utility/tar.gz/f800fc4dada365a701122b5ac1ecb946eb402cb4"
version = "1.4.2"
commit = "dbacc3d0fd26bcd4247dcaf5b7e70ffdf5f69831"
license = "Public Domain with bundled third-party notices"
citation = "Rhie et al. 2020"
doi = "10.1186/s13059-020-02134-9"
pmid = "32928274"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 240
exist = ["meryl", "meryl-lookup", "meryl-import", "meryl-analyze", "meryl-simple", "position-lookup", "gzip", "bzip2", "lzip", "xz", "zstd", "bash", "sh", "grep"]
test = ["test \"$(cat /usr/local/share/doc/meryl/VERSION)\" = '1.4.2' && grep -Fx 'upstream_commit=dbacc3d0fd26bcd4247dcaf5b7e70ffdf5f69831' /usr/local/share/doc/meryl/SOURCE >/dev/null && grep -Fx 'meryl_utility_commit=f800fc4dada365a701122b5ac1ecb946eb402cb4' /usr/local/share/doc/meryl/SOURCE >/dev/null", "meryl --version 2>&1 | grep -Fx 'meryl 1.4.2' >/dev/null", "meryl -h 2>&1 | grep -F 'COMMANDS:' >/dev/null && meryl -h 2>&1 | grep -F 'ploidy' >/dev/null", "meryl-lookup 2>&1 | grep -F 'usage:' >/dev/null && meryl-import 2>&1 | grep -F 'usage:' >/dev/null && meryl-simple 2>&1 | grep -F 'usage:' >/dev/null && meryl-analyze 2>&1 | grep -F -- '-gt' >/dev/null", "if ldd \"$(command -v meryl)\" | grep -F 'not found'; then exit 1; fi; ldd \"$(command -v meryl)\" | grep -F 'libgomp' >/dev/null && ldd \"$(command -v meryl)\" | grep -F 'libcurl' >/dev/null", "tmp=/tmp/taf-meryl-count-$$; trap 'rm -rf \"$tmp\"' EXIT HUP INT TERM; mkdir -p \"$tmp\"; cd \"$tmp\"; printf '>toy\\nACGTACGTACGTACGTACGTACGTACGTACGT\\n' > seq.fa; meryl k=21 memory=0.1 threads=1 count seq.fa output seq.meryl >/dev/null 2>meryl.log; test -d seq.meryl; meryl histogram seq.meryl > seq.hist; grep -E '^6[[:space:]]+2$' seq.hist >/dev/null; meryl statistics seq.meryl > seq.stats; grep -F 'distinct                    2' seq.stats >/dev/null; meryl print seq.meryl > seq.print; grep -F 'ACGTACGTACGTACGTACGTA' seq.print >/dev/null", "tmp=/tmp/taf-meryl-compress-$$; trap 'rm -rf \"$tmp\"' EXIT HUP INT TERM; mkdir -p \"$tmp\"; cd \"$tmp\"; printf '>toy\\nACGTACGTACGTACGTACGTACGTACGTACGT\\n' > seq.fa; gzip -c seq.fa > seq.fa.gz; bzip2 -c seq.fa > seq.fa.bz2; lzip -c seq.fa > seq.fa.lz; xz -c seq.fa > seq.fa.xz; zstd -q -c seq.fa > seq.fa.zst; for ext in gz bz2 lz xz zst; do meryl k=21 memory=0.1 threads=1 count \"seq.fa.$ext\" output \"seq-$ext.meryl\" >/dev/null 2>\"$ext.log\"; meryl histogram \"seq-$ext.meryl\" | grep -E '^6[[:space:]]+2$' >/dev/null; done", "tmp=/tmp/taf-meryl-sam-$$; trap 'rm -rf \"$tmp\"' EXIT HUP INT TERM; mkdir -p \"$tmp\"; cd \"$tmp\"; printf '@HD\\tVN:1.6\\n@SQ\\tSN:toy\\tLN:32\\nr1\\t4\\t*\\t0\\t0\\t*\\t*\\t0\\t0\\tACGTACGTACGTACGTACGTACGTACGTACGT\\tIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIII\\n' > seq.sam; meryl k=21 memory=0.1 threads=1 count seq.sam output seq.meryl >/dev/null 2>meryl.log; test -d seq.meryl; meryl histogram seq.meryl | grep -E '^6[[:space:]]+2$' >/dev/null", "tmp=/tmp/taf-meryl-analyze-$$; trap 'rm -rf \"$tmp\"' EXIT HUP INT TERM; mkdir -p \"$tmp\"; cd \"$tmp\"; printf '>toy\\nACGTACGTACGTACGTACGTACGTACGTACGT\\n' > seq.fa; meryl k=7 memory=0.1 threads=1 count seq.fa output seq.meryl >/dev/null 2>meryl.log; meryl-analyze -mers seq.meryl -prefix motif -gt >/dev/null 2>analyze.log; test -s motif.GT.hist; test -s motif.AC.hist; test -s motif.GT_AC.hist"]
